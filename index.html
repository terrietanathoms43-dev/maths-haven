  7:{title:'Building foundations',topics:['Number sense & fractions','Basic measurement','Patterns & arithmetic']},
  8:{title:'Reasoning with numbers',topics:['Ratios & percentages','Introductory algebra','Area and geometry']},
  9:{title:'Ready for CSEC',topics:['Equations & statistics','Pythagoras & sequences','Consumer arithmetic']},
  10:{title:'CSEC Mathematics',topics:['Algebra & graphs','Geometry & trigonometry','Sequences & computation']},
  11:{title:'CSEC Exam Challenge',topics:['Functions & matrices','Probability & statistics','Geometry & trigonometry']},
  12:{title:'CAPE Unit 1 Explorer',topics:['Functions & algebra','Differentiation & integration','Vectors & trigonometry']},
  13:{title:'CAPE Unit 2 Explorer',topics:['Series & counting','Complex numbers & matrices','Calculus & probability']}
};
const opLabels={add:'Add (+)',sub:'Subtract (−)',mul:'Multiply (×)',div:'Divide (÷)',mix:'Combination'};
const opSymbols={add:'+',sub:'−',mul:'×',div:'÷'};
const skillLabels={fractions:'Fraction Lab',puzzles:'Puzzle Quest',mixed:'Mixed Arena'};
const modeLabels={solo:'Solo Practice',duel:'Local 2-Player Duel',friend:'Friend Challenge'};
const rnd=(lo,hi,random=Math.random)=>Math.floor(random()*(hi-lo+1))+lo;
const pick=(array,random=Math.random)=>array[rnd(0,array.length-1,random)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1;};
const R=(n,d=1)=>{if(d===0)throw Error('Zero denominator');if(d<0){n=-n;d=-d}const f=gcd(n,d);return {n:n/f,d:d/f};};
const add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d);
const sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d);
const mul=(a,b)=>R(a.n*b.n,a.d*b.d);
const div=(a,b)=>R(a.n*b.d,a.d*b.n);
const equal=(a,b)=>Boolean(a&&b&&Math.abs(a.n*b.d-b.n*a.d)<1e-8);
const compare=(a,b)=>a.n*b.d-b.n*a.d;
const fractionText=a=>a.d===1?String(a.n):`${a.n}/${a.d}`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fractionHTML=a=>a.d===1?`<span>${a.n}</span>`:`<span class="mathfrac"><span class="num">${a.n}</span><span class="den">${a.d}</span></span>`;
const mathLine=(parts)=>`<div class="math-line">${parts.map(p=>typeof p==='string'?`<span class="math-sign">${esc(p)}</span>`:fractionHTML(p)).join('')}</div>`;
const formatSigned=(x,power='x')=>`${x<0?'−':'+'} ${Math.abs(x)}${power}`;
function parseFraction(raw){
  let text=String(raw||'').trim().replace(/−/g,'-').replace(/,/g,'');
  if(!text)return null;
  if(text.endsWith('%'))text=text.slice(0,-1).trim(); // percent questions request the numerical percentage
  const mixed=text.match(/^([+-]?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(mixed){const whole=Number(mixed[1]),top=Number(mixed[2]),bottom=Number(mixed[3]);if(!bottom||top>=bottom)return null;return R((Math.sign(whole)||1)*(Math.abs(whole)*bottom+top),bottom);}
  const simple=text.match(/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/);
  if(simple){const n=Number(simple[1]),d=Number(simple[2]);return d?R(n,d):null;}
  if(/^[+-]?(?:\d+\.?\d*|\.\d+)$/.test(text)){
    const x=Number(text);if(!Number.isFinite(x))return null;
    const decimals=(text.split('.')[1]||'').length;
    return decimals<=7?R(Math.round(x*10**decimals),10**decimals):null;
  }
  return null;
}
function hashCode(n){let t=n>>>0;return ()=>{t+=0x6d2b79f5;let z=t;z=Math.imul(z^(z>>>15),z|1);z^=z+Math.imul(z^(z>>>7),z|61);return ((z^(z>>>14))>>>0)/4294967296;};}
function numberOf(n){return n.toLocaleString('en-JM');}
function createFraction(grade,random){
  const denMax=grade<=8?8:grade<=11?13:19;
  const nMax=grade<=8?7:grade<=11?15:25;
  let n=rnd(1,nMax,random),d=rnd(2,denMax,random);
  if(grade>=10&&random()<.24)n*=-1;
  if(grade>=9&&random()<.22)n+=d;

        hint:'Multiply before you add. Use common denominators when adding.',

  }

  const explanation={
    add:`Use a common denominator of ${a.d*b.d/gcd(a.d,b.d)}, then add. ${fractionText(a)} + ${fractionText(b)} = ${fractionText(answer)}.`,
    sub:`Use a common denominator of ${a.d*b.d/gcd(a.d,b.d)}, then subtract. ${fractionText(a)} − ${fractionText(b)} = ${fractionText(answer)}.`,
    mul:`Multiply across and simplify: (${a.n} × ${b.n})/(${a.d} × ${b.d}) = ${fractionText(answer)}.`,

  window.scrollTo?.({top:0,behavior:'smooth'});
  renderQuiz();
}
function cancel(){if(confirm('End this round and return to the home screen?'))home();}
function record(raw,skipped=false){
  if(!session||session.stage!=='question')return;
  const s=session,q=s.questions[s.idx],parsed=skipped?null:parseFraction(raw),valid=skipped||parsed!==null;
  if(!valid){toast('Use a number, decimal, or fraction like 3/4.');return;}
  const correct=!skipped&&equal(parsed,q.answer),player=s.turn;
  const result={raw:skipped?'Skipped':String(raw).trim(),correct,skipped,hint:s.hintShown};
  s.answers[player][s.idx]=result;
  if(correct){s.scores[player]+=100;s.streaks[player]++;s.best=Math.max(s.best,s.streaks[player]);}
  else{s.streaks[player]=0;}
  if(s.mode==='duel'&&player===0){s.stage='handoff';s.turn=1;}
  else{s.stage='feedback';}
  s.hintShown=false;
  renderQuiz();
}
function moveOn(){
  if(!session)return;
  const s=session;
  if(s.stage==='handoff'){s.stage='question';renderQuiz();return;}
  if(s.stage!=='feedback')return;
  s.idx++;s.turn=0;s.hintShown=false;s.stage='question';
  if(s.idx>=s.questions.length){finishSession();return;}
  renderQuiz();
}
function finishSession(){
  const s=session;if(!s||s.finished)return;s.finished=true;
  const count=s.questions.length,correct=s.answers[0].filter(v=>v?.correct).length+(s.mode==='duel'?s.answers[1].filter(v=>v?.correct).length:0),attempts=count*(s.mode==='duel'?2:1);
  const gained=correct*15 + (s.mode==='duel'?10:25);
  stats.xp+=gained;stats.played++;stats.correct+=correct;stats.total+=attempts;stats.best=Math.max(stats.best,s.best);
  stats.history.unshift({at:new Date().toISOString(),grade:s.grade,mode:s.mode,skill:s.skill,score:s.scores[0],score2:s.scores[1],correct,attempts});
  stats.history=stats.history.slice(0,25);saveStats();renderResults(gained);
}
function showHint(){if(session){session.hintShown=true;const el=$('#hint-container');if(el)el.innerHTML=`<div class="hint-box">💡 ${esc(session.questions[session.idx].hint)}</div>`;$('#hint-btn')?.setAttribute('disabled','true');}}
function quizSidebar(){const s=session;return `<aside class="quiz-side"><div class="panel"><h2>Live scoreboard</h2>${s.players.slice(0,s.mode==='duel'?2:1).map((name,i)=>`<div class="score-card"><span class="score-name">${s.mode==='duel'?(i===0?'🔵':'🟡'):'✦'} ${esc(name)}</span><span class="score-points">${s.scores[i]}</span></div>`).join('')}<div class="divider-line"></div><div class="aside-caption">100 points per correct answer. No timer — focus on working it out.</div></div><div class="game-tip"><div style="font-size:30px">📘</div><h3>Maths tip</h3><p>${s.skill==='puzzles'?'Write down what you know before working out the unknown.': 'For fraction questions, simplify your final answer. Equivalent fractions also count as correct.'}</p></div>${s.mode==='friend'?`<div class="panel"><h2>Your friend code</h2><div class="code-card"><strong class="code-value">${esc(s.code)}</strong>${btn('Copy code','copy-code')}</div><p class="mini-note">A friend can enter this on their own device to play the same questions.</p></div>`:''}</aside>`;}
function renderQuiz(){
  const s=session;if(!s)return;
  const q=s.questions[s.idx],isDuel=s.mode==='duel',percent=(s.idx+(s.stage==='feedback'?1:0))/s.questions.length*100;
  let body='';
  if(s.stage==='handoff')body=`<div class="handoff-view"><div class="handoff-emoji">🤝</div><h2>Pass it to ${esc(s.players[1])}!</h2><p>${esc(s.players[0])}'s answer is locked in.<br>The next player will solve the <strong>same question</strong>.</p>${btn(`I'm ready, ${s.players[1]}`,'next-btn','primary-btn navy')}</div>`;
  else if(s.stage==='question')body=`${isDuel?`<div class="turn-banner ${s.turn===1?'p2':''}">${s.turn===0?'🔵':'🟡'} ${esc(s.players[s.turn])}'s turn — question ${s.idx+1}</div>`:''}
    <div class="problem-zone"><span class="puzzle-tag">${esc(q.topic)} ${q.kind==='fraction'?'✦ FRACTIONS':'✦ MATHS PUZZLE'}</span><h2>${q.prompt}</h2><p class="question-subtitle">${q.kind==='fraction'?'Calculate the answer and give it in its simplest form.':'Enter the numerical answer. Include no units.'}</p></div>
    <form id="answer-form" class="answer-box"><label for="answer-input">Your answer</label><div class="answer-field"><input class="answer-input" id="answer-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="e.g. 3/4 or 1.5" aria-label="Your numerical answer" required><button class="primary-btn navy" type="submit">Check answer</button></div><div class="answer-hint">Accepts whole numbers, decimals, fractions (3/4) and mixed numbers (1 1/2).</div></form>
    <div id="hint-container"></div><div class="quiz-actions">${btn('💡 Give me a hint','hint-btn','text-btn')}${btn('Skip question','skip-btn','text-btn')}</div>`;
  else {
    const a=s.answers[0][s.idx],b=s.answers[1][s.idx];
    let content;
    if(!isDuel)content=`<b>${a.correct?'🌟 Brilliant work!':'📘 Good attempt — keep going!'}</b><div>Your answer: <strong>${esc(a.raw)}</strong> ${a.correct?'✓':'✗'}</div><div>Correct answer: <strong>${esc(fractionText(q.answer))}</strong></div>`;
    else content=`<b>Round ${s.idx+1} scores</b><div>🔵 ${esc(s.players[0])}: <strong>${esc(a.raw)}</strong> ${a.correct?'✓':'✗'}</div><div>🟡 ${esc(s.players[1])}: <strong>${esc(b.raw)}</strong> ${b.correct?'✓':'✗'}</div><div>Correct answer: <strong>${esc(fractionText(q.answer))}</strong></div>`;
    body=`<div class="problem-zone"><span class="puzzle-tag">${esc(q.topic)}</span><h2>${q.prompt}</h2></div><div class="result-box ${isDuel?'neutral':a.correct?'good':'bad'}">${content}<p>${esc(q.explanation)}</p></div><div style="margin-top:18px">${btn(s.idx+1===s.questions.length?'Finish round →':'Next question →','next-btn','primary-btn navy')}</div>`;
  }
  app.innerHTML=`<div class="quiz-layout"><div class="quiz-nav"><div class="quiz-breadcrumb"><span class="crumb">Grade ${s.grade}</span><span class="crumb gold">${esc(skillLabels[s.skill])}</span><span class="crumb">${esc(modeLabels[s.mode])}</span></div>${btn('✕ Exit','exit-btn','text-btn')}</div>
  <div class="quiz-grid"><div class="quiz-main"><div class="progress-head"><span>Question <strong>${s.idx+1} of ${s.questions.length}</strong></span><span>${Math.round(percent)}% complete</span></div><div class="progress"><span style="width:${percent}%"></span></div>${body}</div>${quizSidebar()}</div></div>`;
  $('#exit-btn').addEventListener('click',cancel);
  if($('#answer-form'))$('#answer-form').addEventListener('submit',e=>{e.preventDefault();record($('#answer-input').value)});
  if($('#hint-btn'))$('#hint-btn').addEventListener('click',showHint);
  if($('#skip-btn'))$('#skip-btn').addEventListener('click',()=>record('',true));
  if($('#next-btn'))$('#next-btn').addEventListener('click',moveOn);
  if($('#copy-code'))$('#copy-code').addEventListener('click',copyCode);
  if(s.stage==='question')$('#answer-input')?.focus({preventScroll:true});
}
async function copyCode(){if(!session?.code)return;try{await navigator.clipboard.writeText(session.code);toast('Challenge code copied!');}catch{toast('Copy the code shown above to share it.');}}
function renderResults(gained){
  const s=session,count=s.questions.length,a=s.answers[0].filter(v=>v?.correct).length,b=s.answers[1].filter(v=>v?.correct).length;
  const duel=s.mode==='duel';const winner=a===b?'It’s a tie!':`${esc(s.players[a>b?0:1])} takes the win!`;
  const headline=duel?winner:a===count?'A perfect round!':a>=Math.ceil(count*.7)?'Great going!':'Every question makes you stronger.';
  app.innerHTML=`<div class="result-page"><div class="result-hero"><div class="trophy">${duel?'🏆':a===count?'🏆':'🌴'}</div><div class="eyebrow">Round complete • Grade ${s.grade}</div><h1>${headline}</h1><p>${duel?'Two players, one maths challenge.':`You answered ${a} of ${count} questions correctly.`} Keep practising to build skill and confidence.</p></div>
  <div class="results-grid"><div class="result-stat"><b>${duel?`${a}–${b}`:`${a}/${count}`}</b><span>${duel?'Final result':'Correct answers'}</span></div><div class="result-stat"><b>${Math.round((duel?a+b:a)/(duel?count*2:count)*100)}%</b><span>Accuracy</span></div><div class="result-stat"><b>+${gained}</b><span>XP earned</span></div></div>
  ${s.mode==='friend'?`<section class="panel"><h2>Challenge a friend</h2><p class="mini-note">Send the code below and compare your scores once they've finished. Friends play the same exact round independently; this version does not sync scores online.</p><div class="code-card"><strong class="code-value">${esc(s.code)}</strong>${btn('Copy challenge code','copy-results-code')} ${btn('Copy my result','copy-score','secondary-btn')}</div></section>`:''}
  <section class="panel"><div class="panel-heading"><h2>Answer review</h2><span class="section-sub">Learn from every problem</span></div><div class="review-list">${s.questions.map((q,i)=>{
    const a=s.answers[0][i],b=s.answers[1][i];return `<div class="review-item"><div class="review-q">${a.correct?'✓':'○'} ${i+1}. ${esc(q.topic)} ${duel?`· ${esc(s.players[0])} ${a.correct?'✓':'✗'} · ${esc(s.players[1])} ${b.correct?'✓':'✗'}`:''}</div><div class="review-a">Correct answer: <strong>${esc(fractionText(q.answer))}</strong> — ${esc(q.explanation)}</div></div>`;
  }).join('')}</div><div class="result-buttons">${btn('Play again ↻','replay-btn','primary-btn navy')}${btn('Change grade or mode','home-btn')}</div></section></div>`;
  $('#replay-btn').addEventListener('click',()=>createSession(s.mode,s.mode==='friend'?s.seed:Math.floor(Math.random()*4294967295),s.code));
  $('#home-btn').addEventListener('click',home);
  if($('#copy-results-code'))$('#copy-results-code').addEventListener('click',copyCode);
  if($('#copy-score'))$('#copy-score').addEventListener('click',async()=>{const msg=`Maths Haven — Grade ${s.grade} | ${skillLabels[s.skill]} | Score: ${a}/${count} (${Math.round(a/count*100)}%). Challenge code: ${s.code}`;try{await navigator.clipboard.writeText(msg);toast('Your result is copied!');}catch{toast('Select and copy the challenge details manually.');}});
  window.scrollTo?.({top:0,behavior:'smooth'});
}
$('#home-link').addEventListener('click',e=>{e.preventDefault();home();});
refreshXP();
const urlCode=new URLSearchParams(location.search).get('challenge');
if(urlCode){const decoded=decodeCode(urlCode);if(decoded){Object.assign(cfg,{grade:decoded.grade,skill:decoded.skill,op:decoded.op,count:decoded.count,mode:'friend',challengeCode:decoded.code});}}
home();
/* Standalone prototype: service worker will be added with the production app. */
window.IslandMathTest={generateSet,parseFraction,equal,R,decodeCode,generateFraction,generatePuzzle};

</script>
