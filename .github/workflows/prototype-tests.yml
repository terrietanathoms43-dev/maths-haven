name: Maths regression tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  mathematics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run maths unit tests
        run: npm run test:unit
